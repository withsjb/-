[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --alluredir=allure-results
qa_capture = true
qa_driver_fixture = driver
qa_capture_sources = true
qa_capture_output = qa-results
qa_capture_tc_csv = test_data/guest_blindspot_20.csv
enable_assertion_pass_hook = true
markers =
    guest_home: 메인 필수 요소 표시 4개
    guest_quickmenu: 퀵메뉴 이름과 표시 4개
    guest_day_extra: T day 복귀·재진입·교차 이동 4개
    guest_search_extra: 검색 문구·복귀·재진입·교차 이동 4개
    guest_flow_a: 화면 이동 A 4개 (분석 요청 예산 내 묶음)
    guest_flow_b: 화면 이동 B 4개 (분석 요청 예산 내 묶음)
